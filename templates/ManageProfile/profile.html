<!DOCTYPE html>
{% load static %}
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="{% static "css/prof.css" %}">
    <title>SemiDu</title>
    {% load bootstrap5 %}
    
    {% bootstrap_css %}
    {% bootstrap_javascript %}
</head>
<body>
    <div class="container-fluid">
        <div class="row">
            <nav class="col-3 sidebar shadow-lg rounded-3 p-0" style="width: 300px;">
                <div class="flex-column flex-shrink-0 p-2 rounded-3 sidebg" style="width: 300px;">
                  <h4 class="border-black border-bottom">Hello, {{user.username}}<a href="/signOut"><img src="{% static 'img/so.png' %}" width="30" height="30"></a></h4>
                  <a href="/" class="d-flex border-bottom border-black" >
                    <img src="{% static 'img/SemiDu.png' %}" width="200" height="200" class="d-block mx-auto">
                  </a>
                  <ul class="nav flex-column mb-auto">
                    <li>
                      <a href="/" class="nav-link text-black text-center">
                        Home
                      </a>
                    </li>
                    <li class="nav-item">
                      <a href="/manageprof" class="nav-link active text-center">
                        Manage Profile
                      </a>
                    </li>
                    <li>
                      <a href="/manageseminar" class="nav-link text-center text-black">
                        Create Seminar
                      </a>
                    </li>
                    <li>
                      <a href="/reviewDash" class="nav-link text-center text-black">
                        Review Seminar
                      </a>
                    </li>
                    <li>
                      <a href="#Coming Soon" class="nav-link text-center text-black">
                        About Us
                      </a>
                    </li>
                  </ul>
                </div>
            </nav>

            <main class="col-md-9 px-md-4">
            <div class="pt-md-3 pb-md-2 mb-md-3 border-bottom">
                <h1 class="h2 text-center">Manage Your Profile</h1>
            </div>
            <div class=" rounded-5">
                <form action="/manageprof" method="POST">
                {% csrf_token %}
                    <div class ="row g-3">
                        <div class="px-4">
                          <label for="cName" class ="h5">Username</lable>
                          <input type="text" class="form-control" id="cName" name="cName" placeholder="{{user.username}}" Required> <br>
                        </div>
                            
                        </div>
                    </div>
        
                    <div class ="row g-3">
                        <div class="px-4">
                          <label for="cEmail" class ="h5">Email</lable>
                          <input type="email" class="form-control" id="cEmail" name="cEmail" placeholder="{{user.email}}" Required><br>
                        </div>
                    </div>
        
                    <div class ="row g-3">
                        <div class="px-4">
                          <label for="uPhoneNumb" class ="h5">Phone Number</lable>
                          <input type="text" class="form-control" id="cPhoneNumb" name="cPhoneNumb" placeholder="{{user.first_name}}" Required><br>
                        </div>
                    </div>
        
                    <button class="btn btn-success px-5 mx-md-auto d-block" type="submit">Save Changes</button>
                </form>
            </div>
            </main>
        </div>
    </div>
</body>
</html>
